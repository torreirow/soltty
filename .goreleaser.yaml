version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: soltty
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/torreirow/soltty/cmd.version={{.Version}}
    binary: soltty-{{.Os}}-{{.Arch}}

archives:
  - name_template: "soltty-{{.Version}}-{{.Os}}-{{.Arch}}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # Soltty is statically linked, so every archive redistributes the modules
      # below in binary form. Apache-2.0 and the BSD licenses require their texts
      # to travel with it. Regenerate with scripts/update-third-party-licenses.sh.
      - THIRD_PARTY_LICENSES/*

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: torreirow
    name: soltty
